name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        working-directory: mobile
        run: npm run typecheck
      - name: Create Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build installable APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prestasi-kita-admin-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
