name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Configure optional Android push credentials
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const raw = process.env.GOOGLE_SERVICES_JSON;
          if (raw) {
            const config = JSON.parse(raw);
            if (!config.client?.some(c => c.client_info?.android_client_info?.package_name === "com.prestasikita.admin")) throw new Error("Firebase Android package mismatch");
            fs.writeFileSync("google-services.json", JSON.stringify(config));
          } else {
            console.log("::warning::Firebase config missing: background payment push is unavailable. Local foreground notifications remain available.");
          }
          NODE
      - name: Check TypeScript
        working-directory: mobile
        run: npm run typecheck && npm run test:finance
      - name: Create Android project
        working-directory: mobile
        env:
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Build installable APK
        working-directory: mobile/android
        run: >-
          ./gradlew assembleRelease --no-daemon --max-workers=2
          '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8'
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true
      - name: Name APK with version
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/Prestasi-Kita-Admin-v$(node -p "require('./mobile/app.config.js').expo.version").apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prestasi-kita-admin-${{ github.run_number }}
          path: mobile/Prestasi-Kita-Admin-v*.apk
          if-no-files-found: error
