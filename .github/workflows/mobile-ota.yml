name: Publish mobile OTA
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Expo publishing configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Configure EXPO_TOKEN in repository secrets'; exit 1; }
          test -n "$PROJECT_ID" || { echo 'Configure EXPO_PUBLIC_EAS_PROJECT_ID in repository secrets'; exit 1; }
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npm run typecheck && npm run test:finance
        working-directory: mobile
      - name: Configure Android native fingerprint
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node -e 'if(process.env.GOOGLE_SERVICES_JSON) require("fs").writeFileSync("google-services.json", JSON.stringify(JSON.parse(process.env.GOOGLE_SERVICES_JSON)))'
      - name: Publish compatible production update
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: npx eas-cli@16 update --channel production --platform android --message "Mobile update ${{ github.sha }}" --non-interactive
