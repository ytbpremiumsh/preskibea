# Nginx config for Kejar Prestasi — STATIC SPA (Vite + React Router)
# Architecture: Pure Static (no Node SSR / PM2)
#
# Deployment:
# 1. Copy to /etc/nginx/conf.d/kejarprestasi.id.conf
# 2. Update 'root' path if different
# 3. nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name kejarprestasi.id www.kejarprestasi.id;

    root /www/wwwroot/kejarprestasi.id;
    index index.html;

    # Logging
    access_log /var/log/nginx/kejarprestasi.access.log;
    error_log /var/log/nginx/kejarprestasi.error.log warn;

    client_max_body_size 20m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Vite hashed assets — long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static root files
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /ads.txt     { default_type text/plain; try_files $uri =404; }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html so updates are immediate
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
