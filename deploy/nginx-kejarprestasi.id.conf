# Prestasi Kita — Vite SPA statis, tanpa Node.js/PM2/proxy_pass.
# Installer mengganti domain dan webroot bila variabel DOMAIN/WEBROOT diberikan.

server {
  listen 80;
  listen [::]:80;
  server_name prestasikita.com www.prestasikita.com;

  root /www/wwwroot/prestasikita.com/current;
  index index.html;
  client_max_body_size 20m;

  access_log /var/log/nginx/prestasikita.access.log;
  error_log /var/log/nginx/prestasikita.error.log warn;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  location = /favicon.png {
    access_log off;
    log_not_found off;
    try_files $uri =404;
  }

  location = /robots.txt {
    access_log off;
    log_not_found off;
    try_files $uri =404;
  }

  location = /ads.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    access_log off;
    try_files $uri =404;
  }

  # Named fallback mencegah internal redirect loop/HTTP 500 jika index hilang.
  location / {
    try_files $uri $uri/ @spa;
  }

  location @spa {
    try_files /index.html =503;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires 0;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}